
name: testdb
services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_PASSWORD=mypass
      - POSTGRES_USER=myuser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql # Volume makes data persistent when composed down.
volumes:
  postgres_data: